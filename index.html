<!DOCTYPE html>
<html lang="ru">

<head>
    <meta charset="UTF-8">
    <title>Моя практическая работа</title>
</head>

<body>
    <h1>Добро пожаловать на мою страницу</h1>

    <!-- Текст, который будет меняться по кнопке -->
    <p id="text">Исходный текст. Нажмите на кнопку ниже, чтобы его изменить.</p>

    <!-- Картинка с обязательным alt -->
    <img src="https://picsum.photos/300/200" alt="Случайное изображение-заглушка" width="300">

    <br><br>

    <!-- Кнопка -->
    <button id="myButton">Нажми меня</button>

    <hr>

    <h2>Данные из Google Таблицы:</h2>
    <!-- Сюда скрипт будет выводить таблицу -->
    <div id="output">Загрузка данных...</div>

    <!-- Подключение внешнего JS -->
    <script src="script.js"></script>
</body>

</html>
